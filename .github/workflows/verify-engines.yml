name: verify-engines
on: [push, pull_request]
jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # Validadores INDEPENDIENTES de los exports (regla de oro): ezdxf abre
      # el DXF como CAD, ifcopenshell valida el IFC (schema + GUID encoder),
      # pypdf parsea el PDF real. Sin ellos los tests no prueban nada.
      - name: Validadores (ezdxf · ifcopenshell · pypdf)
        run: pip install ezdxf ifcopenshell pypdf matplotlib
      - run: npm ci
      # Motores deterministas — NO requieren next build ni secretos: la
      # cadena completa de AGENTS.md corre local con `npm run verify`.
      - name: Tipos (tsc)
        run: npx tsc --noEmit
      - name: Pipeline (sanitizador · horarios · bitácora)
        run: node scripts/test-pipeline.mjs
      - name: IFC validación independiente (ifcopenshell)
        run: node scripts/verify-ifc-z.mjs
      - name: Repro 3D (web-ifc, mismo camino que el visor)
        run: node scripts/repro-3d.mjs
      - name: Motor DXF/PDF (láminas + modelo 1:1 + QA geométrico)
        run: node scripts/test-design-dxf.mjs
